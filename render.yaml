# ═══════════════════════════════════════════════════════════════════════════
# TONDE — Blueprint Render GRATUIT pour la démo / le MVP (une organisation)
#
# Création : Dashboard Render → New → Blueprint → repo tonde-sys/tonde-backend
#            branche main, chemin render.yaml.
#
# Coût : 0 $/mois. Contreparties du plan gratuit Render :
#   - le web s'endort après 15 min sans trafic → UptimeRobot ping /health
#     toutes les 5 min pour le garder éveillé ;
#   - pas de shell, pas de preDeployCommand, pas de one-off job → les
#     migrations Alembic tournent au démarrage (RUN_MIGRATIONS_ON_STARTUP) ;
#   - PostgreSQL gratuit expire après 30 jours et ne doit pas être utilisé
#     pour un pilote de longue durée ;
#   - Key Value gratuit n'a pas de persistance : Redis est un accélérateur,
#     PostgreSQL reste la vérité et les files sont reconstruites au démarrage.
#
# Pour un pilote réel de plus de 30 jours, passer le Blueprint aux plans
# payants décrits dans DEPLOYMENT.md.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── API FastAPI ───────────────────────────────────────────────────────────
  - type: web
    name: tonde-api-pilot
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CREATE_TABLES_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: APP_VERSION
        value: "1.0.0"

      # Connexions privées Render (même région obligatoire).
      - key: DATABASE_URL
        fromDatabase:
          name: tonde-pilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tonde-pilot-kv
          property: connectionString

      # Secret généré par Render (256 bits), jamais dans le dépôt.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # Origine du cockpit web. Remplacer par l'URL réelle du front si besoin.
      # Jamais "*" en production (l'application refuse de démarrer).
      - key: ALLOWED_ORIGINS
        value: https://tonde-web.onrender.com

      # Facultatif pour une démo backend : ajouter AFRICAS_TALKING_USERNAME et
      # AFRICAS_TALKING_API_KEY dans Dashboard → Environment pour activer les
      # SMS. Sans clés, les endpoints OTP répondent 503 SMS_UNAVAILABLE ; les
      # logins staff par mot de passe et le bootstrap restent utilisables.
      - key: AFRICAS_TALKING_SENDER_ID
        value: TONDE

      # Scheduler in-process : garder une seule instance (voir DEPLOYMENT.md).
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: WS_CONNECT_LIMIT_PER_MINUTE
        value: "120"

  # ── File d'attente Redis (Valkey) ─────────────────────────────────────────
  - type: keyvalue
    name: tonde-pilot-kv
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: off # Le plan gratuit ne persiste pas ; PostgreSQL reste la vérité.
    ipAllowList: [] # Aucun accès externe : réseau privé Render uniquement.

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  - name: tonde-pilot-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "15"
