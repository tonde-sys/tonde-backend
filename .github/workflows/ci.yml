name: TONDE Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations, tests et image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tonde
          POSTGRES_PASSWORD: tonde123
          POSTGRES_DB: tonde_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://tonde:tonde123@localhost:5432/tonde_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: development
      CREATE_TABLES_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Alembic migrations from an empty database
        run: alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -q

      - name: Validate production configuration guardrails
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          CREATE_TABLES_ON_STARTUP: "false"
          DATABASE_URL: postgresql://tonde:tonde123@localhost:5432/tonde_db
          JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOWED_ORIGINS: https://app.example.com
        run: |
          python - <<'PY'
          from app.core.config import Settings

          settings = Settings()
          assert settings.DATABASE_URL.startswith("postgresql+asyncpg://")
          assert settings.is_production
          print("Configuration de production valide.")
          PY

      - name: Build production image
        run: docker build --tag tonde-api:ci .
