name: TONDE Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feat/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations, tests et image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tonde
          POSTGRES_PASSWORD: tonde123
          POSTGRES_DB: tonde_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://tonde:tonde123@localhost:5432/tonde_db
      PG_TEST_URL: postgresql+asyncpg://tonde:tonde123@localhost:5432/tonde_db
      QAPE_REDIS_TEST: "1"
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: development
      CREATE_TABLES_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify disposable database creation privileges
        run: |
          python - <<'PY'
          import psycopg2

          # The official postgres image creates POSTGRES_USER as a superuser.
          # Migration tests connect to the maintenance database and create/drop
          # their own disposable databases; fail early if that changes.
          with psycopg2.connect(
              host="localhost", port=5432, dbname="postgres",
              user="tonde", password="tonde123",
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT rolcreatedb OR rolsuper FROM pg_roles WHERE rolname = current_user"
                  )
                  assert cursor.fetchone() == (True,), "PostgreSQL role cannot create test databases"
          PY

      - name: Apply Alembic migrations from an empty database
        run: alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -q

      - name: Require QAPE migration tests to run without skips
        run: |
          pytest --tb=short -q --junitxml="${RUNNER_TEMP}/qape-migration.xml" tests/test_qape_review_migration.py
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "qape-migration.xml")).getroot()
          cases = root.findall(".//testcase")
          assert cases, "No QAPE migration tests were collected"
          assert not any(case.find("skipped") is not None for case in cases), (
              "QAPE migration tests must not be skipped"
          )
          assert not any(case.find("failure") is not None or case.find("error") is not None
                         for case in cases), "QAPE migration tests failed"
          print(f"Verified {len(cases)} QAPE migration tests, none skipped.")
          PY

      - name: Validate production configuration guardrails
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          CREATE_TABLES_ON_STARTUP: "false"
          DATABASE_URL: postgresql://tonde:tonde123@localhost:5432/tonde_db
          JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOWED_ORIGINS: https://app.example.com
        run: |
          python - <<'PY'
          from app.core.config import Settings

          settings = Settings()
          assert settings.DATABASE_URL.startswith("postgresql+asyncpg://")
          assert settings.is_production
          print("Configuration de production valide.")
          PY

      - name: Build production image
        run: docker build --tag tonde-api:ci .
